services:
  garagedesk:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/garagedesk.db
      FILES_DIR: /data/files
      # this file runs the public demo: the wife is Jenny, as in the README and the
      # video, whatever .env says (the demo VM's .env was copied with "the office").
      # A real shop deletes this line and sets APPROVER_NAME in .env.
      APPROVER_NAME: Jenny
      # the shop's real name, even if an older .env still has the placeholder
      SHOP_NAME: Sunshine North Mechanic
      SHOP_TRADING_NAME: Sunshine North Mechanic
      # fresh demo data each day (Melbourne time), with nobody pressing Reset
      DEMO_DAILY_RESET: "1"
    volumes:
      - garagedesk-data:/data
    restart: unless-stopped

volumes:
  garagedesk-data:
