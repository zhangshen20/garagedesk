name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - run: ruff check backend/app
      - run: pytest -q backend/tests
        env:
          LLM_MODE: mock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t garagedesk:ci .
      - name: Smoke test the image in mock mode
        run: |
          docker run -d --name gd -p 8000:8000 -e LLM_MODE=mock garagedesk:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8000/healthz && break; sleep 2; done
          curl -sf http://localhost:8000/api/overview | head -c 300
          curl -sf http://localhost:8000/ | grep -qi "<div id=\"root\"" || (docker logs gd; exit 1)
