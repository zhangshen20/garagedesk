[project]
name = "garagedesk"
version = "0.1.0"
description = "AI front desk and back office for a small mechanic shop, powered by NVIDIA Nemotron on Nebius Token Factory"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "openai>=1.50",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "reportlab>=4.2",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10",
    "pillow>=10.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
# recorded speech to text on the server (owner app in non-Safari iPhone browsers)
stt = ["faster-whisper>=1.0", "av>=11,<16"]  # av 16+ dropped an argument faster-whisper passes
# the owner voice (app/voice/tts.py); the Docker image installs it with its model
tts = ["kokoro-onnx>=0.4.9,<0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E741", "E712"]
