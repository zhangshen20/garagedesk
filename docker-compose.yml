services:
  garagedesk:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/garagedesk.db
      FILES_DIR: /data/files
      # this file runs the public demo: the wife is Jenny, as in the README and the
      # video, whatever .env says (the demo VM's .env was copied with "the office").
      # A real shop deletes this line and sets APPROVER_NAME in .env.
      APPROVER_NAME: Jenny
    volumes:
      - garagedesk-data:/data
    restart: unless-stopped

volumes:
  garagedesk-data:
